[project]
name = "considering-context"
version = "0.1.0"
description = "Context conditioning in DreamerV3"
requires-python = ">=3.11,<3.12"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "torch==2.8.0",
    "torchrl==0.9.2",
    "tensordict==0.9.1",
    "numpy==1.26.0",
    "hydra-core==1.3.2",
    "gymnasium==1.2.0",
    "cloudpickle==3.1.2",
]

[project.optional-dependencies]
dmc = ["dm_control==1.0.28", "mujoco==3.3.0"]
carl = [
    "carl-bench[dm_control] @ git+https://github.com/automl/CARL.git@f4b51b6cfc39b1dea4600750dc52bfae1de50186",
    "chardet<6",
    "dm_control==1.0.28",
    "mujoco==3.3.0",
]
attractor = ["mujoco==3.3.0"]
